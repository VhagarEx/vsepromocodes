<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Каталог — Все промокоды</title>
  <link rel="stylesheet" href="styles/site.css">
  <script type="module" src="scripts/catalog.js"></script>
  <script type="module" src="scripts/header.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">К содержанию</a>
  <header class="site-header">
    <div class="container header-content">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Все промокоды</span>
      </a>
      <nav class="site-nav" aria-label="Каталог">
        <a href="catalog.html" aria-current="page">Каталог</a>
        <details class="header-menu">
          <summary>Магазины</summary>
          <ul class="menu-panel" id="header-stores">
            <li><a href="catalog.html">Все магазины</a></li>
          </ul>
        </details>
        <details class="header-menu">
          <summary>Предложения</summary>
          <ul class="menu-panel">
            <li><a href="catalog.html?type=code">Промокоды</a></li>
            <li><a href="catalog.html?type=link">Акции</a></li>
          </ul>
        </details>
      </nav>
      <form class="header-search" role="search" action="catalog.html" method="get">
        <input id="site-search" type="search" name="q" maxlength="100" placeholder="Поиск по каталогу" aria-label="Поиск по каталогу">
        <button type="submit" aria-label="Найти"><span class="search-icon" aria-hidden="true"></span></button>
      </form>
      <details class="header-menu account-menu">
        <summary>Аккаунт</summary>
        <ul class="menu-panel">
          <li><a href="login.html">Вход</a></li>
          <li><a href="register.html">Регистрация</a></li>
        </ul>
      </details>
    </div>
  </header>
  <main id="main" class="container page">
    <section class="directory-intro">
      <h1>Каталог предложений</h1>
    </section>
    <div class="directory" data-directory="catalog">
      <aside class="store-sidebar">
        <h2>Магазины</h2>
        <nav class="store-list" id="stores" aria-label="По магазинам"></nav>
        <div class="store-filter">
          <label for="store-filter">Магазин</label>
          <select id="store-filter"><option value="">Все магазины</option></select>
        </div>
        <noscript><p>Включите JavaScript, чтобы выбрать магазин.</p></noscript>
      </aside>
      <section aria-label="Предложения">
        <div class="catalog-filters" role="group" aria-label="Тип предложения">
          <button type="button" data-filter="all" aria-pressed="true">Все</button>
          <button type="button" data-filter="code" aria-pressed="false">Промокоды</button>
          <button type="button" data-filter="link" aria-pressed="false">Акции</button>
        </div>
        <p class="search-context" id="search-context" hidden>
          Поиск по запросу «<span id="search-query"></span>».
          <a href="catalog.html" id="clear-search">Сбросить поиск</a>
        </p>
        <p class="results-count" id="results-count" role="status"></p>
        <div class="offer-list" id="offers"></div>
        <noscript><p>Включите JavaScript, чтобы посмотреть предложения.</p></noscript>
      </section>
    </div>
    <dialog class="offer-dialog" id="offer-dialog" aria-labelledby="offer-heading">
      <div class="dialog-inner">
        <form class="dialog-close" method="dialog">
          <button class="close-button" aria-label="Закрыть" autofocus>×</button>
        </form>
        <img class="dialog-logo" id="offer-logo" alt="">
        <h2 id="offer-heading"></h2>
        <p class="offer-date" id="offer-date"></p>
        <div class="code-box">
          <code id="offer-code"></code>
          <button class="button" type="button" id="copy-code">Скопировать код</button>
        </div>
        <p class="copy-status" id="copy-status" role="status"></p>
      </div>
      <details class="dialog-details" id="offer-details">
        <summary>Условия промокода</summary>
        <p id="offer-terms"></p>
      </details>
    </dialog>
  </main>
  <footer class="site-footer">
    <div class="container footer-content">
      <span>Все промокоды</span>
      <p>Учебный проект. Предложения демонстрационные.</p>
    </div>
  </footer>
</body>
</html>
