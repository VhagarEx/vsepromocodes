<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Все промокоды — скидки на доставку</title>
  <link rel="stylesheet" href="styles/site.css">
  <script type="module" src="scripts/catalog.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">К содержанию</a>
  <header class="site-header">
    <div class="container header-content">
      <a class="brand" href="index.html" aria-label="Все промокоды, главная"><span class="brand-mark" aria-hidden="true">%</span> все<span class="brand-accent">промокоды</span></a>
      <nav class="site-nav" aria-label="Основная">
        <a href="index.html" aria-current="page">Главная</a>
        <a href="catalog.html">Каталог</a>
        <a href="register.html">Регистрация</a>
        <a href="login.html">Вход</a>
      </nav>
    </div>
  </header>
  <main id="main" class="container page">
    <section class="home-intro">
      <h1>Промокоды на доставку еды</h1>
      <p>Скидки на заказы из магазинов и ресторанов.</p>
    </section>
    <nav class="store-grid" id="stores" aria-label="Магазины и сервисы"></nav>
    <section class="section" aria-labelledby="offers-heading">
      <div class="section-heading">
        <h2 id="offers-heading">Предложения</h2>
        <a href="catalog.html">Все предложения</a>
      </div>
      <div class="offer-grid home-offers" id="offers"></div>
      <noscript><p>Включите JavaScript, чтобы посмотреть предложения.</p></noscript>
    </section>
    <dialog class="offer-dialog" id="offer-dialog" aria-labelledby="offer-heading">
      <div class="dialog-inner">
        <div class="dialog-header">
          <p class="offer-badge">Промокод</p>
          <form method="dialog"><button class="close-button" aria-label="Закрыть" autofocus>×</button></form>
        </div>
        <h2 id="offer-heading"></h2>
        <p class="dialog-terms" id="offer-terms"></p>
        <p class="offer-date" id="offer-date"></p>
        <div class="code-box"><code id="offer-code"></code></div>
        <button class="button" type="button" id="copy-code">Скопировать код</button>
        <p class="copy-status" id="copy-status" role="status"></p>
      </div>
    </dialog>
  </main>
  <footer class="site-footer">
    <div class="container footer-content">
      <span>Все промокоды</span>
      <p>Учебный проект. Предложения демонстрационные.</p>
    </div>
  </footer>
</body>
</html>
