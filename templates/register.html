{% extends 'base.html' %}
{% block title %}Регистрация — Все промокоды{% endblock %}
{% block main %}
  <main id="main" class="container page account-page">
    <section class="account-card">
      <h1>Регистрация</h1>
      <form method="post" class="account-form management-form" novalidate>
        {% csrf_token %}
        {% include '_form_fields.html' %}
        <button class="button" type="submit">Создать аккаунт</button>
      </form>
      <p class="account-switch">Уже есть аккаунт? <a href="{% url 'login' %}">Войти</a></p>
    </section>
  </main>
{% endblock %}
