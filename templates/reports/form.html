{% extends 'base.html' %}
{% block title %}{{ heading }} — Все промокоды{% endblock %}
{% block main %}
  <main id="main" class="container page account-page">
    <section class="account-card">
      <h1>{{ heading }}</h1>
      <p class="account-note">{{ offer.display_title }}</p>
      <form class="account-form management-form" method="post" novalidate>
        {% csrf_token %}
        {% include '_form_fields.html' %}
        <button class="button" type="submit">Сохранить обращение</button>
      </form>
      {% if report %}
        <a href="{% url 'report-detail' report.pk %}">Отмена</a>
      {% else %}
        <a href="{% url 'offer-detail' %}?id={{ offer.pk }}">К предложению</a>
      {% endif %}
    </section>
  </main>
{% endblock %}
