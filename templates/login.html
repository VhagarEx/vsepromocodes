{% extends 'base.html' %}
{% block title %}Вход — Все промокоды{% endblock %}
{% block main %}
  <main id="main" class="container page account-page">
    <section class="account-card">
      <h1>Вход</h1>
      {% for message in messages %}<p class="form-status" role="status">{{ message }}</p>{% endfor %}
      <form method="post" class="account-form management-form" novalidate>
        {% csrf_token %}
        {% include '_form_fields.html' %}
        {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
        <button class="button" type="submit">Войти</button>
      </form>
      <p class="account-switch">Нет аккаунта? <a href="{% url 'register' %}">Зарегистрироваться</a></p>
    </section>
  </main>
{% endblock %}
