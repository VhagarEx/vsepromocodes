<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вход — Все промокоды</title>
  <link rel="stylesheet" href="styles/site.css">
  <script type="module" src="scripts/forms.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">К содержанию</a>
  <header class="site-header">
    <div class="container header-content">
      <a class="brand" href="index.html">Все промокоды</a>
      <nav class="site-nav" aria-label="Основная">
        <a href="index.html">Главная</a>
        <a href="catalog.html">Каталог</a>
        <a href="register.html">Регистрация</a>
        <a href="login.html" aria-current="page">Вход</a>
      </nav>
    </div>
  </header>
  <main id="main" class="container page account-page">
    <section class="account-card">
      <h1>Вход</h1>
      <p class="account-note">Учебная форма. Вход в аккаунт здесь не выполняется.</p>
      <noscript><p>Включите JavaScript, чтобы использовать форму.</p></noscript>
      <form method="post" class="account-form" id="login-form">
        <div class="form-field">
          <label for="login">Логин или email</label>
          <input id="login" name="login" type="text" autocomplete="username" aria-describedby="login-error" required>
          <p class="form-error" id="login-error" hidden></p>
        </div>
        <div class="form-field">
          <label for="password">Пароль</label>
          <input id="password" name="password" type="password" autocomplete="current-password" aria-describedby="password-error" required>
          <p class="form-error" id="password-error" hidden></p>
        </div>
        <button class="button" type="submit" disabled>Войти</button>
        <p class="form-status" role="status" hidden></p>
      </form>
      <p class="account-switch">Нет аккаунта? <a href="register.html">Зарегистрироваться</a></p>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container footer-content">
      <span>Все промокоды</span>
      <p>Учебный проект. Предложения демонстрационные.</p>
    </div>
  </footer>
</body>
</html>
