<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Регистрация — Все промокоды</title>
  <link rel="stylesheet" href="styles/site.css">
  <script type="module" src="scripts/forms.js"></script>
  <script type="module" src="scripts/header.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">К содержанию</a>
  <header class="site-header">
    <div class="container header-content">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Все промокоды</span>
      </a>
      <nav class="site-nav" aria-label="Каталог">
        <a href="catalog.html">Каталог</a>
        <details class="header-menu">
          <summary>Магазины</summary>
          <ul class="menu-panel" id="header-stores">
            <li><a href="catalog.html">Все магазины</a></li>
          </ul>
        </details>
        <details class="header-menu">
          <summary>Предложения</summary>
          <ul class="menu-panel">
            <li><a href="catalog.html?type=code">Промокоды</a></li>
            <li><a href="catalog.html?type=link">Акции</a></li>
          </ul>
        </details>
      </nav>
      <form class="header-search" role="search" action="catalog.html" method="get">
        <input id="site-search" type="search" name="q" maxlength="100" placeholder="Поиск по каталогу" aria-label="Поиск по каталогу">
        <button type="submit" aria-label="Найти"><span class="search-icon" aria-hidden="true"></span></button>
      </form>
      <details class="header-menu account-menu">
        <summary>Аккаунт</summary>
        <ul class="menu-panel">
          <li><a href="login.html">Вход</a></li>
          <li><a href="register.html" aria-current="page">Регистрация</a></li>
        </ul>
      </details>
    </div>
  </header>
  <main id="main" class="container page account-page">
    <section class="account-card">
      <h1>Регистрация</h1>
      <p class="account-note">Учебная форма. Введённые данные не сохраняются.</p>
      <noscript><p>Включите JavaScript, чтобы использовать форму.</p></noscript>
      <form method="post" class="account-form" id="register-form" novalidate>
        <div class="form-field">
          <label for="full-name">ФИО</label>
          <input id="full-name" name="full-name" type="text" autocomplete="name" aria-describedby="full-name-error" required>
          <p class="form-error" id="full-name-error" hidden></p>
        </div>
        <div class="form-field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" aria-describedby="email-error" required>
          <p class="form-error" id="email-error" hidden></p>
        </div>
        <div class="form-field">
          <label for="login">Логин</label>
          <input id="login" name="login" type="text" autocomplete="username" aria-describedby="login-error" required>
          <p class="form-error" id="login-error" hidden></p>
        </div>
        <div class="form-field">
          <label for="password">Пароль</label>
          <small id="password-hint">Не менее 8 символов</small>
          <input id="password" name="password" type="password" autocomplete="new-password" aria-describedby="password-hint password-error" minlength="8" required>
          <p class="form-error" id="password-error" hidden></p>
        </div>
        <div class="form-field">
          <label for="password-repeat">Повтор пароля</label>
          <input id="password-repeat" name="password-repeat" type="password" autocomplete="new-password" aria-describedby="password-repeat-error" required>
          <p class="form-error" id="password-repeat-error" hidden></p>
        </div>
        <button class="button" type="submit" disabled>Проверить данные</button>
        <p class="form-status" role="status" hidden></p>
      </form>
      <p class="account-switch">Уже есть аккаунт? <a href="login.html">Войти</a></p>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container footer-content">
      <span>Все промокоды</span>
      <p>Учебный проект. Предложения демонстрационные.</p>
    </div>
  </footer>
</body>
</html>
